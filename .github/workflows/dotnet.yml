name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Ships the viewer: publish-viewer + release are gated on a manual dispatch, because six AOT
  # publishes are far too slow to run per push. The release tag (v$VERSION_LINE) is created by the
  # release job, not pushed by hand — a hand-pushed tag could disagree with VERSION_LINE and end up
  # creating a release under a different name than the tag that triggered it.
  workflow_dispatch:

env:
  # The release line, and the only number a human picks. The viewer, the release tag and anything we
  # quote to a user are ALWAYS just major.minor — 1.5, then 1.6. The libraries append the run number
  # and attempt so every push to main is a distinct NuGet version.
  #
  # Deliberately NOT a composite VERSION_PREFIX here: a workflow-level env value cannot reference
  # another (the `env` context is not in scope yet), so a composite would have to restate the line and
  # could drift from it. The parts are assembled in the shell at each point of use, where they are
  # ordinary environment variables.
  VERSION_LINE: '1.5'
  VERSION_BUILD: ${{ github.run_number }}
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_SUFFIX: +${{ github.sha }}
  BUILD_CONF: Release

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # LFS-backed CR2 fixtures (.gitattributes pattern *.cr2) are only needed by
        # FC.SDK.Raw.Tests. Skip the default lfs pull and do a narrow, cached pull
        # below so we only spend LFS bandwidth when fixtures actually change.
        lfs: false
    - name: Compute LFS cache key
      id: lfs-key
      run: |
        # Pointer-file content (OID + size) changes only when the underlying LFS
        # object changes, so hashing the pointers reliably identifies which set
        # of LFS objects we'd be pulling. Cache hit -> no LFS bandwidth.
        HASH=$(git ls-files '*.cr2' '*.cr3' '*.CR2' '*.CR3' '*.cr2.gz' | xargs cat 2>/dev/null | sha256sum | cut -c1-16)
        echo "key=lfs-test-${HASH}" >> $GITHUB_OUTPUT
    - uses: actions/cache@v4
      with:
        path: .git/lfs
        key: ${{ steps.lfs-key.outputs.key }}
    - name: Fetch test-fixture LFS objects
      # Uppercase variants matter on case-sensitive filesystems (Linux CI):
      # *.CR3 fixture (Canon_EOS_M50_CRAW.CR3) is distinct from *.cr3 glob there.
      run: git lfs pull --include="*.cr2,*.cr3,*.CR2,*.CR3,*.cr2.gz"
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      # Version assembled here rather than in env, so the release line is stated exactly once.
      # Concatenating VERSION_REV (not dotting it) preserves the existing scheme: run 53 attempt 1
      # is 1.5.531, matching the 1.4.4xx/1.4.5xx packages already on nuget.org.
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_LINE}.${VERSION_BUILD}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_LINE}.${VERSION_BUILD}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Test
      run: dotnet test -c $BUILD_CONF --no-build --verbosity normal
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5

  publish:
    runs-on: ubuntu-latest
    needs: build
    # Pushes to nuget.org, which is irreversible — a version can be unlisted but never replaced.
    # So: only a real push to main. Excluded on
    #   - pull_request, which used to publish a package per PR from unreviewed code and burn the
    #     version number for the eventual merge (this cost 1.5.531);
    #   - workflow_dispatch, so cutting a viewer release does not also push a second,
    #     differently-numbered set of packages.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
    - name: Push NuGet package
      run: dotnet nuget push **/*.nupkg -s nuget.org -k ${{ secrets.NUGET_API_KEY }}

  # Self-contained NativeAOT builds of the diagnostic viewer, one per RID. A bug reporter should be
  # able to download one file, run it, and send back the log — no .NET SDK, no build step.
  #
  # Runs in parallel with `build` rather than after it: an AOT publish takes minutes per RID, and
  # the `release` job below re-gates on both, so nothing ships unless the tests also passed.
  publish-viewer:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   rid: win-x64 }
          - { os: windows-latest,   rid: win-arm64 }
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest,     rid: osx-arm64 }
          - { os: macos-latest,     rid: osx-x64 }

    runs-on: ${{ matrix.os }}
    steps:
    # Defender real-time scanning in-lines every file write, which is brutal on an AOT publish
    # (ILC + MSVC link churn thousands of object files). Excluding the work dirs before checkout
    # lands any files is the cheap fix; same step as tianwen's publish matrix.
    - name: Exclude work dirs from Defender (Windows CI speedup)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:USERPROFILE\.nuget"
    - uses: actions/checkout@v4
      with:
        # No LFS pull at all: the CR2/CR3 fixtures belong to FC.SDK.Raw.Tests, and publishing a
        # single app project never builds the test project.
        lfs: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Publish FC.SDK.Viewer
      shell: bash
      # Version is the release line (1.5) because that is what the viewer is called everywhere;
      # FileVersion carries the exact build so a binary in the wild can still be traced to a run.
      # GeneratePackageOnBuild=false: the two library projects in the graph pack by default, and a
      # publish has no business emitting nupkgs that the `publish` job might then pick up.
      run: >
        dotnet publish src/FC.SDK.Viewer/FC.SDK.Viewer.csproj
        -r ${{ matrix.rid }} -c Release
        -p:Version=${VERSION_LINE}
        -p:FileVersion=${VERSION_LINE}.${VERSION_BUILD}.${VERSION_REV}
        -p:ContinuousIntegrationBuild=true
        -p:GeneratePackageOnBuild=false
    - uses: actions/upload-artifact@v4
      with:
        name: fc-viewer-${{ matrix.rid }}
        path: src/FC.SDK.Viewer/bin/Release/net10.0/${{ matrix.rid }}/publish/

  # Only ship binaries once the tests passed AND every RID published.
  release:
    needs: [build, publish-viewer]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: fc-viewer-*
        path: artifacts
    - name: Create release archives
      run: |
        cd artifacts
        for dir in fc-viewer-*/; do
          name="${dir%/}"
          # zip for Windows RIDs, tar.gz elsewhere. The audience is someone triaging their camera,
          # not a developer — a double-click-to-extract archive removes one step of friction.
          if [[ "$name" == *-win-* ]]; then
            (cd "$dir" && zip -qr "../../${name}.zip" .)
          else
            tar -czf "../${name}.tar.gz" -C "$dir" .
          fi
        done
    - name: Create GitHub Release
      # One release per line: v1.5, then v1.6. The action creates the tag if it does not exist and
      # updates the release in place if it does, so re-publishing binaries into 1.5 keeps the same
      # URL — which matters because those download links get quoted in issues and stay there.
      uses: SharpAstro/action-gh-release@v3
      with:
        tag_name: v${{ env.VERSION_LINE }}
        name: v${{ env.VERSION_LINE }}
        generate_release_notes: true
        files: |
          fc-viewer-*.zip
          fc-viewer-*.tar.gz
