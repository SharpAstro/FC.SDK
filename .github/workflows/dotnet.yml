name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  VERSION_PREFIX: 1.4.${{ github.run_number }}
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_SUFFIX: +${{ github.sha }}
  BUILD_CONF: Release

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # LFS-backed CR2 fixtures (.gitattributes pattern *.cr2) are only needed by
        # FC.SDK.Raw.Tests. Skip the default lfs pull and do a narrow, cached pull
        # below so we only spend LFS bandwidth when fixtures actually change.
        lfs: false
    - name: Compute LFS cache key
      id: lfs-key
      run: |
        # Pointer-file content (OID + size) changes only when the underlying LFS
        # object changes, so hashing the pointers reliably identifies which set
        # of LFS objects we'd be pulling. Cache hit -> no LFS bandwidth.
        HASH=$(git ls-files '*.cr2' '*.cr3' '*.CR2' '*.CR3' '*.cr2.gz' | xargs cat 2>/dev/null | sha256sum | cut -c1-16)
        echo "key=lfs-test-${HASH}" >> $GITHUB_OUTPUT
    - uses: actions/cache@v4
      with:
        path: .git/lfs
        key: ${{ steps.lfs-key.outputs.key }}
    - name: Fetch test-fixture LFS objects
      # Uppercase variants matter on case-sensitive filesystems (Linux CI):
      # *.CR3 fixture (Canon_EOS_M50_CRAW.CR3) is distinct from *.cr3 glob there.
      run: git lfs pull --include="*.cr2,*.cr3,*.CR2,*.CR3,*.cr2.gz"
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Test
      run: dotnet test -c $BUILD_CONF --no-build --verbosity normal
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5

  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
    - name: Push NuGet package
      run: dotnet nuget push **/*.nupkg -s nuget.org -k ${{ secrets.NUGET_API_KEY }}
