name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Ships the viewer: publish-viewer + release are gated on a manual dispatch, because six AOT
  # publishes are far too slow to run per push. The release tag (v$VERSION_LINE) is created by the
  # release job, not pushed by hand — a hand-pushed tag could disagree with VERSION_LINE and end up
  # creating a release under a different name than the tag that triggered it.
  workflow_dispatch:

env:
  # The release line is NOT here any more. It lives in src/Directory.Build.props
  # (VersionMajorMinor) and each job that needs it reads it back, so it cannot drift from what the
  # packages declare and a LOCAL dotnet pack stamps the same line CI does. It used to be VERSION_LINE
  # here and nowhere else, which meant no csproj carried a version at all and a local pack produced
  # the SDK default 1.0.0.
  #
  # It stays a bare major.minor: the viewer, the release tag and anything we quote to a user are
  # ALWAYS just that — 1.6, then 1.7. The libraries append the run number and attempt so every push to
  # main is a distinct NuGet version, assembled in the shell at each point of use. Deliberately NOT a
  # composite: a workflow-level env value cannot reference another (the `env` context is not in scope
  # yet), so a composite would have to restate the line and could drift from it.
  VERSION_BUILD: ${{ github.run_number }}
  VERSION_REV: ${{ github.run_attempt }}
  # No build-metadata suffix on purpose. A `+sha` makes the version SemVer 2.0.0, which NuGet flags
  # (NU5105) and which is not part of package identity anyway — and ContinuousIntegrationBuild plus
  # SourceLink already record the exact commit in the symbols. There used to be a VERSION_SUFFIX here
  # alongside a `${VERSION_HASH}` reference in the build step; the names never matched, so the suffix
  # was silently dropped and every package published so far has a clean version. Removing both rather
  # than connecting them keeps it that way: NuGet versions can be unlisted but never replaced.
  BUILD_CONF: Release
  # Three jobs CAPTURE a dotnet invocation's stdout to resolve the release line, so the SDK's
  # first-run banner must not be able to land in it.
  DOTNET_NOLOGO: 1

jobs:
  build:

    runs-on: ubuntu-latest
    # Consumed by `release`, which downloads artifacts and never checks the repo out, so it has no
    # src/Directory.Build.props of its own to read the line from.
    outputs:
      version-line: ${{ steps.version.outputs.line }}

    steps:
    - uses: actions/checkout@v4
      with:
        # LFS-backed CR2 fixtures (.gitattributes pattern *.cr2) are only needed by
        # FC.SDK.Raw.Tests. Skip the default lfs pull and do a narrow, cached pull
        # below so we only spend LFS bandwidth when fixtures actually change.
        lfs: false
    - name: Compute LFS cache key
      id: lfs-key
      run: |
        # Pointer-file content (OID + size) changes only when the underlying LFS
        # object changes, so hashing the pointers reliably identifies which set
        # of LFS objects we'd be pulling. Cache hit -> no LFS bandwidth.
        HASH=$(git ls-files '*.cr2' '*.cr3' '*.CR2' '*.CR3' '*.cr2.gz' | xargs cat 2>/dev/null | sha256sum | cut -c1-16)
        echo "key=lfs-test-${HASH}" >> $GITHUB_OUTPUT
    - uses: actions/cache@v4
      with:
        path: .git/lfs
        key: ${{ steps.lfs-key.outputs.key }}
    - name: Fetch test-fixture LFS objects
      # Uppercase variants matter on case-sensitive filesystems (Linux CI):
      # *.CR3 fixture (Canon_EOS_M50_CRAW.CR3) is distinct from *.cr3 glob there.
      run: git lfs pull --include="*.cr2,*.cr3,*.CR2,*.CR3,*.cr2.gz"
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Resolve release line
      id: version
      # Read the line back from the one place it is written (src/Directory.Build.props) instead of
      # restating it here. -getProperty only EVALUATES the file: nothing is built and no restore is
      # needed, so this can run before restore. The value is CAPTURED, so nothing else may print to
      # stdout: DOTNET_NOLOGO (workflow env) keeps the SDK first-run banner out, and the shape check
      # makes anything unexpected, or a renamed property, fail the run rather than quietly building
      # everything as ".<run>". Published as a job output for `release`, which has no checkout of its
      # own to read the file from.
      run: |
        MM="$(dotnet msbuild src/Directory.Build.props -getProperty:VersionMajorMinor -nologo)"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from src/Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "VERSION_LINE=${MM}" >> "$GITHUB_ENV"
        echo "line=${MM}" >> "$GITHUB_OUTPUT"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      # Version assembled here rather than in env, so the release line is stated exactly once.
      # Concatenating VERSION_REV (not dotting it) preserves the existing scheme: run 53 attempt 1
      # is 1.5.531, matching the 1.4.4xx/1.4.5xx packages already on nuget.org.
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_LINE}.${VERSION_BUILD}${VERSION_REV} -p:FileVersion=${VERSION_LINE}.${VERSION_BUILD}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Test
      run: dotnet test -c $BUILD_CONF --no-build --verbosity normal
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5

  publish:
    runs-on: ubuntu-latest
    needs: build
    # Pushes to nuget.org, which is irreversible — a version can be unlisted but never replaced.
    # So: only a real push to main. Excluded on
    #   - pull_request, which used to publish a package per PR from unreviewed code and burn the
    #     version number for the eventual merge (this cost 1.5.531);
    #   - workflow_dispatch, so cutting a viewer release does not also push a second,
    #     differently-numbered set of packages.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
    - name: Push NuGet package
      run: dotnet nuget push **/*.nupkg -s nuget.org -k ${{ secrets.NUGET_API_KEY }}

  # Self-contained NativeAOT builds of the diagnostic viewer, one per RID. A bug reporter should be
  # able to download one file, run it, and send back the log — no .NET SDK, no build step.
  #
  # Runs in parallel with `build` rather than after it: an AOT publish takes minutes per RID, and
  # the `release` job below re-gates on both, so nothing ships unless the tests also passed.
  publish-viewer:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   rid: win-x64 }
          - { os: windows-latest,   rid: win-arm64 }
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest,     rid: osx-arm64 }
          - { os: macos-latest,     rid: osx-x64 }

    runs-on: ${{ matrix.os }}
    steps:
    # Defender real-time scanning in-lines every file write, which is brutal on an AOT publish
    # (ILC + MSVC link churn thousands of object files). Excluding the work dirs before checkout
    # lands any files is the cheap fix; same step as tianwen's publish matrix.
    - name: Exclude work dirs from Defender (Windows CI speedup)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:USERPROFILE\.nuget"
    - uses: actions/checkout@v4
      with:
        # No LFS pull at all: the CR2/CR3 fixtures belong to FC.SDK.Raw.Tests, and publishing a
        # single app project never builds the test project.
        lfs: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Resolve release line
      # Resolved here rather than taken from `build`, because this job deliberately runs in PARALLEL
      # with it (see the comment above the job) and a needs: would serialise the two. They read the
      # same file at the same commit, so they cannot disagree. Explicit bash: half this matrix is
      # Windows, where the default shell is pwsh and the case statement would not parse.
      shell: bash
      run: |
        MM="$(dotnet msbuild src/Directory.Build.props -getProperty:VersionMajorMinor -nologo)"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from src/Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "VERSION_LINE=${MM}" >> "$GITHUB_ENV"
    - name: Publish FC.SDK.Viewer
      shell: bash
      # Version is the release line (1.6) because that is what the viewer is called everywhere;
      # FileVersion carries the exact build so a binary in the wild can still be traced to a run.
      # GeneratePackageOnBuild=false: the two library projects in the graph pack by default, and a
      # publish has no business emitting nupkgs that the `publish` job might then pick up.
      run: >
        dotnet publish src/FC.SDK.Viewer/FC.SDK.Viewer.csproj
        -r ${{ matrix.rid }} -c Release
        -p:Version=${VERSION_LINE}
        -p:FileVersion=${VERSION_LINE}.${VERSION_BUILD}.${VERSION_REV}
        -p:ContinuousIntegrationBuild=true
        -p:GeneratePackageOnBuild=false
    - uses: actions/upload-artifact@v4
      with:
        name: fc-viewer-${{ matrix.rid }}
        path: src/FC.SDK.Viewer/bin/Release/net10.0/${{ matrix.rid }}/publish/

  # Only ship binaries once the tests passed AND every RID published.
  release:
    needs: [build, publish-viewer]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Inherited from build rather than resolved here: this job only downloads artifacts, so it has no
    # checkout and therefore no src/Directory.Build.props to read.
    env:
      VERSION_LINE: ${{ needs.build.outputs.version-line }}
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: fc-viewer-*
        path: artifacts
    - name: Create release archives
      run: |
        cd artifacts
        for dir in fc-viewer-*/; do
          name="${dir%/}"
          # zip for Windows RIDs, tar.gz elsewhere. The audience is someone triaging their camera,
          # not a developer — a double-click-to-extract archive removes one step of friction.
          if [[ "$name" == *-win-* ]]; then
            (cd "$dir" && zip -qr "../../${name}.zip" .)
          else
            tar -czf "../${name}.tar.gz" -C "$dir" .
          fi
        done
    - name: Create GitHub Release
      # One release per line: v1.6, then v1.7. The action creates the tag if it does not exist and
      # updates the release in place if it does, so re-publishing binaries into 1.6 keeps the same
      # URL — which matters because those download links get quoted in issues and stay there.
      uses: SharpAstro/action-gh-release@v3
      with:
        tag_name: v${{ env.VERSION_LINE }}
        name: v${{ env.VERSION_LINE }}
        generate_release_notes: true
        files: |
          fc-viewer-*.zip
          fc-viewer-*.tar.gz
